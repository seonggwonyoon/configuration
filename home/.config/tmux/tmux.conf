unbind C-b
set -g prefix `
bind ` last-window
bind e send-prefix

if-shell '[ -x /opt/homebrew/bin/fish ]' 'set -g default-shell /opt/homebrew/bin/fish'

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g allow-rename off
set -g mouse on
set -s escape-time 0
set -g history-limit 100000
set -g display-time 2000
set -g status-interval 5
set -g focus-events on
setw -g aggressive-resize on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D

setw -g mode-keys vi
set -g set-clipboard on
unbind [
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

set -g status-position bottom
set -g status-style "bg=#282828,fg=#a89984"
set -g status-left ""
set -g status-left-length 20
set -g status-right "#[fg=#282828,bg=#7c6f64,bold] %m/%d #[fg=#282828,bg=#a89984,bold] %H:%M:%S "
set -g status-right-length 50
setw -g window-status-format " #I#[fg=#665c54]:#[fg=#a89984]#W#F "
setw -g window-status-current-format " #I#[fg=#bdae93]:#[fg=#fbf1c7,bold]#W#[fg=#fabd2f]#F "
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#d79921"
set -g message-style "bg=#504945,fg=#ebdbb2"
set -g mode-style "bg=#504945,fg=#ebdbb2"

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
